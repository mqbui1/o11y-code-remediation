services:
  o11y-code-remediation:
    build: .
    container_name: o11y-code-remediation
    ports:
      - "4319:4318"
    environment:
      - PORT=4318
      - HOST=0.0.0.0
      - ENVIRONMENT=${ENVIRONMENT:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-bedrock}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      # Prototype: real Splunk internal profiling `api` service (see
      # streaming/internal_api_client.py). Requires this container to be on
      # the same docker network as that service (e.g.
      # `docker network connect dev_profiling_default o11y-code-remediation`).
      - INTERNAL_API_BASE_URL=${INTERNAL_API_BASE_URL:-http://api:8080}
      - INTERNAL_API_ORG_ID=${INTERNAL_API_ORG_ID:-}
    volumes:
      # Needed by receiver/source_reader.py to read source files from other
      # running containers for the /api/source and /api/fix endpoints.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
